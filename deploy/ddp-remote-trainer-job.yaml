# DDP trainer with OFFLOADED reward (HTTP reward server) + sglang rollout.
# Reward scoring no longer runs in-process -> frees trainer GPU AND removes the multi-rank
# reward-model-load deadlock, so DDP (nproc>1) works. Scale NPROC/GPUs to push the training rate.
apiVersion: batch/v1
kind: Job
metadata:
  name: will-tts-grpo-ddp
  namespace: trainers
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app: will-tts-grpo-ddp}}
    spec:
      restartPolicy: Never
      priorityClassName: skypilot-high-priority
      nodeSelector: {nvidia.com/gpu.product: NVIDIA-H200}
      containers:
        - name: grpo
          image: williammtan/whiplash-grpo:v3
          imagePullPolicy: Always
          workingDir: /root
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - {name: NCCL_IB_DISABLE, value: "1"}
            - {name: GRPO_DIR, value: "/weka/whiplash-grpo"}
            - {name: HF_HOME, value: "/weka/whiplash-grpo/hf-cache"}
            - {name: HUGGINGFACE_HUB_CACHE, value: "/weka/whiplash-grpo/hf-cache"}
            - {name: CODE_DIR, value: "/workspace/whiplash"}
            - {name: GITHUB_REPO, value: "Osmosis-AI/whiplash"}
            - {name: GIT_REF, value: "grpo-ablations"}
            - {name: GITHUB_TOKEN, valueFrom: {secretKeyRef: {name: will-decagon-github, key: GITHUB_TOKEN}}}
            - {name: MODEL_ID, value: "Qwen/Qwen3-TTS-12Hz-1.7B-Base"}
            - {name: REF_AUDIO, value: "/weka/whiplash-sft/data/maeneka/ref.wav"}
            - {name: DATA_JSONL, value: "/weka/whiplash-grpo/tts/voice_14k_synthetic_04_27_clean.jsonl"}
            - {name: PROMPTS_JSONL, value: "/weka/whiplash-grpo/tts/assistant_prompts.jsonl"}
            - {name: SGLANG_URL, value: "http://will-grpo-sglang:8000"}
            - {name: REWARD_URL, value: "http://will-tts-reward:8100"}   # offloaded reward
            - {name: NPROC, value: "2"}
            - {name: PROMPTS_PER_STEP, value: "4"}   # global rollouts = PROMPTS_PER_STEP * NPROC * g(8)
            - {name: MAX_STEPS, value: "3224"}
            - {name: VERL_OMNI_REF, value: "feat/qwen-tts"}   # for the remote-reward patcher
            - {name: MLFLOW_TRACKING_URI, valueFrom: {secretKeyRef: {name: will-decagon-mlflow, key: MLFLOW_TRACKING_URI, optional: true}}}
            - {name: MLFLOW_TRACKING_USERNAME, valueFrom: {secretKeyRef: {name: will-decagon-mlflow, key: MLFLOW_TRACKING_USERNAME, optional: true}}}
            - {name: MLFLOW_TRACKING_PASSWORD, valueFrom: {secretKeyRef: {name: will-decagon-mlflow, key: MLFLOW_TRACKING_PASSWORD, optional: true}}}
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -ex
              mkdir -p "${GRPO_DIR}"/{hf-cache,ckpts} "$(dirname "${CODE_DIR}")"
              set +x
              git config --global credential.helper store
              printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" > "${HOME}/.git-credentials"
              chmod 600 "${HOME}/.git-credentials"; set -x
              rm -rf "${CODE_DIR}" /workspace/code
              git clone --depth 1 --branch "${GIT_REF}" "https://github.com/${GITHUB_REPO}.git" "${CODE_DIR}"
              git clone --depth 1 --branch "${VERL_OMNI_REF}" https://github.com/williammtan/verl-omni.git /workspace/code
              test -f "${REF_AUDIO}"; test -f "${DATA_JSONL}"
              cd "${CODE_DIR}"
              # Offload reward: patch the trainer to use the HTTP reward server (no in-process models).
              python /workspace/code/deploy/patch_remote_reward.py "${CODE_DIR}/whiplash"
              sed -i "s/^prompts_per_step:.*/prompts_per_step: ${PROMPTS_PER_STEP}/" conf/grpo/synth.yaml
              grep -E '^prompts_per_step:|^g:' conf/grpo/synth.yaml
              pip install -q requests || true
              # Build prompts.jsonl (dedup assistant lines).
              python - <<'PY'
              import json, os
              src=os.environ["DATA_JSONL"]; out=os.environ["PROMPTS_JSONL"]; seen=set(); n=0
              with open(src) as f, open(out,"w") as w:
                  for line in f:
                      line=line.strip()
                      if not line: continue
                      conv=json.loads(line); cid=conv.get("conversation_id","conv"); k=0
                      for m in conv.get("messages",[]):
                          if m.get("role")!="assistant": continue
                          t=(m.get("content") or "").strip()
                          if len(t)<8 or t in seen: continue
                          seen.add(t); w.write(json.dumps({"id":f"{cid}#{k}","text":t})+"\n"); k+=1; n+=1
              print(f"[prompts] wrote {n} assistant lines", flush=True)
              PY
              ML_FLAG="--mlflow"; [ -z "${MLFLOW_TRACKING_URI}" ] && ML_FLAG="--no-mlflow"
              # wait for sglang + reward server
              python - <<'PY'
              import os,sys,time,urllib.request
              for name,url in [("sglang",os.environ["SGLANG_URL"]+"/v1/models"),("reward",os.environ["REWARD_URL"]+"/health")]:
                  for i in range(180):
                      try: urllib.request.urlopen(url,timeout=5); print(f"[wait] {name} ready",flush=True); break
                      except Exception as e:
                          if i%6==0: print(f"[wait] {name} not ready ({e})",flush=True)
                          time.sleep(10)
                  else: sys.exit(f"[wait] {name} never ready")
              PY
              python -m whiplash.run grpo \
                  --prompts "${PROMPTS_JSONL}" --ref-audio "${REF_AUDIO}" --model-id "${MODEL_ID}" \
                  --config conf/grpo/synth.yaml --out "${GRPO_DIR}/ckpts" \
                  --sglang-url "${SGLANG_URL}" --nproc "${NPROC}" --max-steps "${MAX_STEPS}" \
                  --mlflow-run-name will-tts-grpo-ddp ${ML_FLAG}
          resources:
            requests: {cpu: "32", memory: 600Gi, nvidia.com/gpu: 2, ephemeral-storage: 20Gi}
            limits: {nvidia.com/gpu: 2, memory: 1200Gi, ephemeral-storage: 50Gi}
          volumeMounts:
            - {name: weka, mountPath: /weka}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - {name: weka, persistentVolumeClaim: {claimName: weka-data}}
        - {name: dshm, emptyDir: {medium: Memory, sizeLimit: 128Gi}}
